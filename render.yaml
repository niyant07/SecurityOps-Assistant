# Render Blueprint: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: securityops-assistant
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Random access code generated by Render; copy it from the service's
      # Environment tab and share it only with people who may use the scanner.
      - key: SECURITYOPS_ACCESS_CODE
        generateValue: true
      # AI provider for the hosted copy. Set ANTHROPIC_API_KEY in the dashboard to
      # enable AI analysis; without it the app shows the rule-based analysis.
      - key: SECURITYOPS_LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
