# SecurityOps Assistant — default configuration
# User overrides live in ~/.config/securityops/config.yaml and take precedence.

application:
  name: "SecurityOps Assistant"
  # Directory names are resolved under the platform data/config dirs at runtime.
  organization: "SecurityOps"

logging:
  level: "INFO"          # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console: true
  file: true
  max_bytes: 5242880     # 5 MiB per log file
  backup_count: 5

database:
  # Relative filename resolved under the data directory. Use ":memory:" for tests.
  filename: "securityops.db"

ui:
  theme: "dark"          # "dark" or "light"
  confirm_tool_launch: true
  font_family: "Sans Serif"
  font_size: 10

tools:
  # Extra directories to search for tool binaries, in addition to $PATH.
  extra_paths:
    - "/usr/share/kali-tools"
  # A terminal emulator used to launch interactive/console tools.
  # {cmd} is replaced with the full command line.
  terminal:
    program: "x-terminal-emulator"
    args: ["-e", "bash", "-lc", "{cmd}; exec bash"]

assistant:
  # The offline assistant is a static knowledge base — no network access.
  enabled: true

assessment:
  # Seconds to wait for each DNS/HTTP/TLS request.
  timeout_seconds: 8
  # Optional allow-list. When empty, any target you confirm you are authorized to
  # assess is accepted. Entries may be hosts, *.wildcards, IPs or CIDR ranges.
  allowed_targets: []
  # Targets that must never be assessed. These always win over allowed_targets.
  blocked_targets: []

llm:
  # AI Security Analysis provider:
  #   ollama    — a local model (default; nothing leaves your machine)
  #   anthropic — Claude via the Anthropic API; set the ANTHROPIC_API_KEY
  #               environment variable (keys are never stored in this file)
  #   none      — rule-based analysis only
  # If the provider is unreachable, the app still shows the scan results and a
  # rule-based analysis with a clear message.
  enabled: true
  provider: "ollama"
  host: "http://localhost:11434"
  model: "llama3"
  api_model: "claude-opus-5-5"

rag:
  # 100% local RAG engine (Retrieval-Augmented Generation).
  # Dynamically indexes security docs, tool manuals, remediation guides, and findings.
  enabled: true
  top_k: 3
  embedding_model: "nomic-embed-text"

reporting:
  author: "Security Analyst"
  company: "Your Organization"
  # Default classification banner printed on reports.
  classification: "CONFIDENTIAL"
